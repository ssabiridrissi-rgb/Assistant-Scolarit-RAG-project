[project]
name = "assistant-scolarite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sabir Idrissi", email = "s.sabir_idrissi@mundiapolis.ma" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain-chroma==1.1.0",
    "langchain-huggingface>=1.2.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
assistant-scolarite = "assistant_scolarite:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
